<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dela ditt recept | Receptsajten</title>
    <meta name="description" content="Dela ditt recept på Receptsajten" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="assets/icons/favicon.ico" />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Hoppa till innehållet</a>

    <header class="site-header">
      <a href="index.html" class="site-logo">Receptsajten</a>

      <nav aria-label="Huvudnavigation">
        <ul class="site-nav">
          <li>
            <a href="index.html">Hem</a>
          </li>
          <li>
            <a href="pannkakor.html">Recept</a>
          </li>
          <li>
            <a href="dela.html" class="share-button" aria-current="page"
              >Dela recept</a
            >
          </li>
        </ul>
      </nav>
    </header>
    <main id="main-content" class="recipe-share">
      <h1>Dela ditt recept</h1>
      <p>Dela med dig av din favoriträtt och se ditt recept här på sajten.</p>

      <form class="recipe-form">
        <fieldset>
          <legend>Om receptet</legend>
          <label for="recipe-name">
            Receptets namn *
            <input
              type="text"
              name="recipe-name"
              id="recipe-name"
              placeholder="Ex. Grillad lax"
              aria-describedby="recipe-name-error"
              required
            />
            <span class="form-error" id="recipe-name-error">
              🛈 Receptet behöver ett namn
            </span>
          </label>
          <label for="recipe-category">
            Kategori
            <select name="category" id="recipe-category">
              <option value="">Välj kategori</option>
              <option value="breakfast">Frukost</option>
              <option value="fika">Fika</option>
              <option value="lunch">Lunch</option>
              <option value="starters">Förrätter</option>
              <option value="dinner">Middag</option>
              <option value="desserts">Efterrätter</option>
            </select>
          </label>
          <div class="recipe-details">
            <label for="time">
              Tid i minuter
              <input
                name="time"
                id="time"
                type="number"
                min="1"
                max="999"
                placeholder="Ex. 60"
              />
            </label>
            <label for="servings">
              Antal portioner
              <input
                name="servings"
                id="servings"
                type="number"
                min="1"
                max="100"
                placeholder="Ex. 4"
              />
            </label>
          </div>
        </fieldset>
        <fieldset>
          <legend>Svårighetsgrad</legend>
          <div class="difficulty">
            <label for="easy"
              ><input type="radio" name="difficulty" id="easy" value="easy" />
              Lätt</label
            >

            <label for="medium"
              ><input
                type="radio"
                name="difficulty"
                id="medium"
                value="medium"
              />
              Medel</label
            >

            <label for="hard"
              ><input type="radio" name="difficulty" id="hard" value="hard" />
              Svår</label
            >
          </div>
        </fieldset>
        <fieldset>
          <legend>Ditt recept</legend>
          <label for="ingredients"
            >Ingredienser *
            <textarea
              name="ingredients"
              id="ingredients"
              placeholder="Ex. Lök, chili, nudlar.."
              aria-describedby="ingredients-error"
              required
            ></textarea>
            <span class="form-error" id="ingredients-error">
              🛈 Ett recept behöver ingredienser
            </span>
          </label>

          <label for="how-to"
            >Gör så här *
            <textarea
              name="how-to"
              id="how-to"
              placeholder="Ex. Koka nudlarna enligt anvisning på paketet.."
              aria-describedby="how-to-error"
              required
            ></textarea>
            <span class="form-error" id="how-to-error">
              🛈 Du måste beskriva hur man lagar receptet
            </span>
          </label>
        </fieldset>
        <fieldset>
          <legend>Om dig</legend>
          <label for="your-name"
            >Ditt namn
            <input
              type="text"
              name="your-name"
              id="your-name"
              placeholder="Ex. Maria Larsson"
            />
          </label>

          <label for="your-email"
            >E-post *
            <input
              type="email"
              name="your-email"
              id="your-email"
              placeholder="Ex. maria@mail.se"
              aria-describedby="email-error"
              required
            />
            <span class="form-error" id="email-error">
              🛈 Ange en giltig e-postadress
            </span>
          </label>
        </fieldset>

        <button type="submit">Dela receptet</button>
      </form>
    </main>
    <footer class="site-footer">
      <p>
        <a
          href="https://unsplash.com/collections/dRdbSqqE9Jo/receptsajten/55cc9c4c289f804ef19763352f9e6303"
          >Bildkällor</a
        >. Typsnitt:
        <a
          href="https://fonts.google.com/specimen/Chewy?query=chewy&preview.script=Latn"
          >Chewy</a
        >,
        <a
          href="https://fonts.google.com/specimen/Atkinson+Hyperlegible?preview.script=Latn"
          >Atkinson Hyperlegible</a
        >. Ikoner: <a href="https://fonts.google.com/icons">Google Icons</a>
      </p>
    </footer>
  </body>
</html>
